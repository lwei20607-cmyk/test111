name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract App source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/AttributionTestApp-v4.4.zip"
          EXTRACT_DIR="$GITHUB_WORKSPACE/extracted_app"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: ZIP not found: $ZIP_PATH"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"

          /usr/bin/ditto \
            -x \
            -k \
            "$ZIP_PATH" \
            "$EXTRACT_DIR"

          PROJECT_FILE=$(find "$EXTRACT_DIR" \
            -maxdepth 4 \
            -type d \
            -name "*.xcodeproj" \
            -print \
            -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No .xcodeproj found after extracting ZIP."
            find "$EXTRACT_DIR" -maxdepth 4 -print
            exit 1
          fi

          PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)

          echo "Project found:"
          echo "$PROJECT_FILE"

          echo "PROJECT_DIR=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          xcodebuild \
            -project "$PROJECT_FILE" \
            -list

      - name: Build for Real Device (Ad-Hoc Sign)
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT_DIR" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="-" \
            VALIDATE_PRODUCT=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "xcodebuild exit code: $BUILD_STATUS"
          echo ""

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Build failed and no .app was generated."
            echo ""
            echo "========== XCODE ERRORS =========="
            grep -iE "error:|fatal error|BUILD FAILED" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -100 || true
            exit 1
          fi

          echo "APP successfully generated:"
          echo "$APP_PATH"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "WARNING: xcodebuild returned $BUILD_STATUS,"
            echo "but the iPhone .app exists, so packaging will continue."
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          exit 0

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$GITHUB_WORKSPACE/ipa_package"
          PAYLOAD_DIR="$PACKAGE_DIR/Payload"
          IPA_PATH="$GITHUB_WORKSPACE/AttributionTestApp-v4.4.ipa"

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$PACKAGE_DIR"
          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA generated:"
          echo "$IPA_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AttributionTestApp-v4.4
          path: AttributionTestApp-v4.4.ipa
          if-no-files-found: error
